[platformio]
default_envs = esp32s3_obd_gauge_drive_v8_8

[env:esp32s3_obd_gauge_drive_v8_8]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = Bodmer/TFT_eSPI@2.5.43
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_build.partitions = default_16MB.csv
build_unflags = -std=gnu++11
build_flags =
    -D GAUGE_CONTINUOUS=1
    -D GAUGE_DRIVE_UI=1
    -std=gnu++17
    -I../../include
    -I../../src
    -I../../lib/GaugeCore/src
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    -D USE_FSPI_PORT=1
    -D TFT_MISO=-1
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=8
    -D SPI_FREQUENCY=27000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT8=1

[env:esp32s3_obd_gauge_drive_v8_8_20hz_trial]
extends = env:esp32s3_obd_gauge_drive_v8_8
build_flags =
    ${env:esp32s3_obd_gauge_drive_v8_8.build_flags}
    -D GAUGE_REQUEST_HZ=20

[env:esp32s3_obd_gauge_drive_v8_8_pair_probe]
extends = env:esp32s3_obd_gauge_drive_v8_8
build_flags =
    ${env:esp32s3_obd_gauge_drive_v8_8.build_flags}
    -D GAUGE_PAIR_PROBE=1

[env:esp32s3_obd_gauge_drive_v8_8_pair_trial]
extends = env:esp32s3_obd_gauge_drive_v8_8_20hz_trial
build_flags =
    ${env:esp32s3_obd_gauge_drive_v8_8_20hz_trial.build_flags}
    -D GAUGE_PAIR_TRIAL=1

[env:esp32s3_obd_gauge_drive_v8_8_pair_continuous]
extends = env:esp32s3_obd_gauge_drive_v8_8_20hz_trial
build_flags =
    ${env:esp32s3_obd_gauge_drive_v8_8_20hz_trial.build_flags}
    -D GAUGE_PAIR_CONTINUOUS=1
