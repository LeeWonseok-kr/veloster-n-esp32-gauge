[platformio]
default_envs = esp32s3_obd_gauge_no_sleep
extra_configs = ../obd_gauge_drive_v8_8/platformio.ini

[env:esp32s3_obd_gauge_no_sleep]
extends = env:esp32s3_obd_gauge_drive_v8_8_pair_continuous
upload_speed = 115200
build_flags =
    ${env:esp32s3_obd_gauge_drive_v8_8_pair_continuous.build_flags}
    -D GAUGE_LED_CONTROL=1
    -D GAUGE_NO_SLEEP_CEREMONY=1
