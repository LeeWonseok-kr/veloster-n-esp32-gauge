<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker></defs><rect width="1100" height="760" fill="#f8fafc"/><g font-family="Segoe UI, Malgun Gothic, sans-serif" fill="#172033"><text x="30" y="38" font-size="26">Veloster N · ESP32-S3 개발보드 배선 개요</text><text x="30" y="66" font-size="16">현재 사용 구성 / GPIO13 LED 제어 / 새 통합 PCB 회로와 구분</text><rect x="30" y="110" width="235" height="150" rx="12" fill="white" stroke="#64748b" stroke-width="2"/><text x="46" y="140" font-size="20">차량 OBD-II</text><text x="46" y="170" font-size="16">16: +12V → BEC 입력</text><text x="46" y="196" font-size="16">6: CAN H / 14: CAN L</text><text x="46" y="222" font-size="16">GND: 기존 케이블 접지</text><rect x="350" y="110" width="260" height="125" rx="12" fill="white" stroke="#64748b" stroke-width="2"/><text x="366" y="140" font-size="20">BEC (기존 전원부)</text><text x="366" y="170" font-size="16">입력: 차량 12V / GND</text><text x="366" y="196" font-size="16">출력: 5V / GND</text><path d="M265 150 L350 150" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="350" y="310" width="260" height="195" rx="12" fill="white" stroke="#64748b" stroke-width="2"/><text x="366" y="340" font-size="20">ESP32-S3 N16R8</text><text x="366" y="370" font-size="16">5V ← BEC 5V</text><text x="366" y="396" font-size="16">3V3 → CAN 모듈 VCC</text><text x="366" y="422" font-size="16">GPIO4 → TXD / GPIO5 ← RXD</text><text x="366" y="448" font-size="16">GPIO6 → RS/STB (있는 경우)</text><text x="366" y="474" font-size="16">GND: 공통 접지</text><path d="M480 235 L480 310" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="330" width="235" height="175" rx="12" fill="white" stroke="#64748b" stroke-width="2"/><text x="46" y="360" font-size="20">3.3V CAN 모듈</text><text x="46" y="390" font-size="16">CAN H/L ← 차량 CAN H/L</text><text x="46" y="416" font-size="16">VCC ← S3 3V3</text><text x="46" y="442" font-size="16">TXD: 기존 10kΩ 풀업 유지</text><text x="46" y="468" font-size="16">추가 120Ω 종단저항 없음</text><path d="M147 260 L147 330" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M265 410 L350 410" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="715" y="110" width="350" height="350" rx="12" fill="white" stroke="#64748b" stroke-width="2"/><text x="731" y="140" font-size="20">3.5인치 SPI TFT · ILI9488</text><text x="731" y="170" font-size="16">VCC ← BEC 5V / GND 공통</text><text x="731" y="196" font-size="16">LED ← GPIO13 (제어 입력)</text><text x="731" y="222" font-size="16">RST ← GPIO8</text><text x="731" y="248" font-size="16">DC/RS ← GPIO9</text><text x="731" y="274" font-size="16">CS ← GPIO10</text><text x="731" y="300" font-size="16">SDI/MOSI ← GPIO11</text><text x="731" y="326" font-size="16">SCK ← GPIO12</text><text x="731" y="352" font-size="16">SDO/MISO: 미연결</text><text x="731" y="378" font-size="16">터치·SD: 현재 사용하지 않음</text><path d="M610 175 L715 175" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M610 390 L715 390" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="715" y="510" width="350" height="125" rx="12" fill="white" stroke="#64748b" stroke-width="2"/><text x="731" y="540" font-size="20">노트북 USB</text><text x="731" y="570" font-size="16">업로드: OBD/BEC 분리, USB 단독</text><text x="731" y="596" font-size="16">차량 전원 사용: 기존 VBUS 분리 유지</text><text x="731" y="622" font-size="16">데이터와 GND만 연결하는 기존 구성</text><path d="M715 555 L610 470" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="30" y="575" font-size="20">공통 GND: 차량/BEC/ESP32-S3/CAN/TFT</text><text x="30" y="615" font-size="16">GPIO13은 TFT 백라이트 제어용입니다. 백라이트 전력을 GPIO에서 공급하지 않습니다.</text><text x="30" y="646" font-size="16">차량 케이블의 USB-C 모양 커넥터는 일반 USB가 아닙니다. PC에 연결하지 않습니다.</text><text x="30" y="677" font-size="16">기존 CAN 모듈의 RS/STB 노출 여부와 케이블 핀은 실제 배선과 대조해야 합니다.</text><text x="30" y="722" font-size="14">연결 관계를 보여주는 개요도이며 부품 배치도·차량용 전원 보호 회로도는 아닙니다.</text></g></svg>