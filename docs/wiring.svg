<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#475569"/></marker></defs><rect width="1100" height="760" fill="#f8fafc"/><g font-family="Segoe UI, Malgun Gothic, sans-serif" fill="#172033"><text x="30" y="38" font-size="26">Veloster N · ESP32-S3 Wiring Overview</text><text x="30" y="66" font-size="14">Current development-board assembly · GPIO13 LED control · Not the integrated PCB</text><rect x="30" y="110" width="235" height="150" rx="12" fill="white" stroke="#64748b" stroke-width="2"/><text x="46" y="140" font-size="18">Vehicle OBD-II</text><text x="46" y="170" font-size="14">16: +12V → BEC input</text><text x="46" y="196" font-size="14">6: CAN H / 14: CAN L</text><text x="46" y="222" font-size="14">GND: existing cable ground</text><rect x="350" y="110" width="260" height="125" rx="12" fill="white" stroke="#64748b" stroke-width="2"/><text x="366" y="140" font-size="18">Existing 5V BEC</text><text x="366" y="170" font-size="14">Input: vehicle 12V / GND</text><text x="366" y="196" font-size="14">Output: 5V / GND</text><path d="M265 150 L350 150" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="350" y="310" width="260" height="195" rx="12" fill="white" stroke="#64748b" stroke-width="2"/><text x="366" y="340" font-size="18">ESP32-S3 N16R8</text><text x="366" y="370" font-size="14">5V ← BEC 5V</text><text x="366" y="396" font-size="14">3V3 → CAN module VCC</text><text x="366" y="422" font-size="14">GPIO4 → TXD / GPIO5 ← RXD</text><text x="366" y="448" font-size="14">GPIO6 → RS/STB if exposed</text><text x="366" y="474" font-size="14">GND: common reference</text><path d="M480 235 L480 310" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="330" width="235" height="175" rx="12" fill="white" stroke="#64748b" stroke-width="2"/><text x="46" y="360" font-size="18">3.3V CAN module</text><text x="46" y="390" font-size="14">H/L ← vehicle CAN H/L</text><text x="46" y="416" font-size="14">VCC ← S3 3V3</text><text x="46" y="442" font-size="14">TXD: retain 10kΩ pull-up</text><text x="46" y="468" font-size="14">No added 120Ω termination</text><path d="M147 260 L147 330" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M265 410 L350 410" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="715" y="110" width="350" height="350" rx="12" fill="white" stroke="#64748b" stroke-width="2"/><text x="731" y="140" font-size="18">3.5-inch SPI TFT · ILI9488</text><text x="731" y="170" font-size="14">VCC ← BEC 5V / common GND</text><text x="731" y="196" font-size="14">LED ← GPIO13 (control input)</text><text x="731" y="222" font-size="14">RST ← GPIO8</text><text x="731" y="248" font-size="14">DC/RS ← GPIO9</text><text x="731" y="274" font-size="14">CS ← GPIO10</text><text x="731" y="300" font-size="14">SDI/MOSI ← GPIO11</text><text x="731" y="326" font-size="14">SCK ← GPIO12</text><text x="731" y="352" font-size="14">SDO/MISO: not connected</text><text x="731" y="378" font-size="14">Touch / SD: not used</text><path d="M610 175 L715 175" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M610 390 L715 390" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="715" y="510" width="350" height="125" rx="12" fill="white" stroke="#64748b" stroke-width="2"/><text x="731" y="540" font-size="18">Laptop USB</text><text x="731" y="570" font-size="14">Flash: USB only; OBD/BEC off</text><text x="731" y="596" font-size="14">Vehicle power: keep VBUS isolated</text><text x="731" y="622" font-size="14">Existing data + GND connection</text><path d="M715 555 L610 470" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="30" y="575" font-size="18">Common GND: vehicle / BEC / ESP / CAN / TFT</text><text x="30" y="615" font-size="14">GPIO13 controls the TFT backlight. Do not power the backlight directly from this GPIO.</text><text x="30" y="646" font-size="14">The vehicle cable uses a USB-C-shaped connector but is NOT USB. Never connect it to a PC.</text><text x="30" y="677" font-size="14">Verify the actual module RS/STB connection and cable pinout against the physical wiring.</text><text x="30" y="722" font-size="14">Connection overview only; not a component layout or an automotive power-protection schematic.</text></g></svg>